name: vn_address_widget
description: >
  VN Address Widget — offline Vietnam admin-hierarchy lookup app + home-screen
  widgets. UI/presentation only; all geocoding logic lives in the shared Rust
  core (see ADR 0002).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
