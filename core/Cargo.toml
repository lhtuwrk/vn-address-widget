[package]
name = "vnaddr-core"
version = "0.1.0"
edition = "2021"
publish = false

# ADR 0002 §9: single extern "C" surface, one binding stack.
# Consumed as: dylib (Dart FFI, Android JNI shim) and staticlib (iOS XCFramework).
[lib]
name = "vnaddr"
crate-type = ["cdylib", "staticlib"]

[dependencies]
# ADR 0002 §10: process-wide reopenable dataset handle (ArcSwapOption<Dataset>),
# not a OnceLock, so §4's bootstrap swap and phase4/03's OTA activation work
# without a process restart.
arc-swap = "1"

# ADR 0002 §9: JNI shim lives in this same crate/.so behind the "android" feature,
# not a separate C shim or second .so.
jni = { version = "0.21", optional = true }

[features]
android = ["dep:jni"]

[build-dependencies]
# ADR 0002 §9: C header generated by cbindgen into include/vnaddr.h, consumed by
# Dart FFI, the Android JNI shim, and Swift alike.
cbindgen = "0.27"

[profile.release]
panic = "unwind" # ADR 0002 §10: catch_unwind at the FFI boundary requires unwind, not abort.
