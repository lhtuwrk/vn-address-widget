name: CI

# Phase0/03 scope: one build step per component with independent pass/fail
# visibility (ticket phase0/03, AC5). No test-coverage requirements beyond
# "does it build" — that's explicitly out of scope for this ticket.
#
# CI provider: GitHub Actions was chosen as a default — the ticket's own open
# question notes the org's actual CI conventions (provider, iOS signing
# certs) were unknown at scaffolding time. Revisit if that's wrong.

on:
  push:
  pull_request:

jobs:
  rust-core:
    name: core (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo clippy -- -D warnings

  flutter-app:
    name: app (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android-widget:
    name: android widget module (Kotlin + Glance)
    runs-on: ubuntu-latest
    needs: [rust-core, flutter-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Build libvnaddr.so per ABI (ADR 0002 §9)
        working-directory: core
        run: |
          cargo ndk -t arm64-v8a -t x86_64 \
            -o ../app/android/app/src/main/jniLibs build --release
      - name: Verify 16KB page alignment (ADR 0002 §9)
        run: |
          for so in app/android/app/src/main/jniLibs/*/libvnaddr.so; do
            echo "Checking $so"
            llvm-readelf -l "$so" | grep -A1 LOAD | grep -q "0x4000\|0x1000" || \
              (echo "::warning::$so may not be 16KB-aligned — verify with llvm-readelf" )
          done
        continue-on-error: true # informational until NDK r28 is standard in CI images
      - run: flutter pub get
        working-directory: app
      - name: Assemble debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Release-configuration FFI smoke build (ADR 0002 §9 — Android only)
        working-directory: app
        run: flutter build apk --release

  ios-widget:
    name: ios widget module (Swift + WidgetKit)
    runs-on: macos-latest
    needs: [rust-core, flutter-app]
    steps:
      - uses: actions/checkout@v4
      - name: Check for Runner.xcodeproj
        run: |
          if [ ! -d "app/ios/Runner.xcodeproj" ]; then
            echo "::error::app/ios/Runner.xcodeproj does not exist yet."
            echo "This job is expected to fail until the manual Xcode setup"
            echo "in app/ios/README.md has been done once (requires a Mac)."
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: app
      - name: Build (debug, simulator)
        working-directory: app
        run: flutter build ios --debug --simulator --no-codesign
      - name: Verify vnaddr_* symbols survive Release archive stripping (ADR 0002 §9)
        working-directory: app/ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -archivePath build/Runner.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          nm -gU build/Runner.xcarchive/Products/Applications/Runner.app/Runner \
            | grep -c "_vnaddr_" || (echo "::error::no vnaddr_* symbols found in archived Runner binary" && exit 1)
